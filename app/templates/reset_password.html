{% extends "base.html" %}
{% block title %}Choose a new password · TestMu Lite{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
  <h1>Choose a new password</h1>
  {% if error %}<p class="error" role="alert" data-testid="reset-error">{{ error }}</p>{% endif %}
  {% if valid %}
  <form method="post" action="/reset-password" novalidate data-testid="reset-form">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" data-testid="reset-password">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" data-testid="reset-confirm-password">
    <button type="submit" data-testid="reset-submit">Update password</button>
  </form>
  {% endif %}
  <a href="/forgot-password" data-testid="request-new-link">Request a new link</a>
</main>
{% endblock %}
