[pytest]
testpaths = tests
markers =
    smoke: fast end-to-end check that the framework and app are wired up
    ui: browser tests (Playwright)
    api: REST API tests (httpx)
    unit: unit tests for ai/ code
    login: Login module
    dashboard: Dashboard module
    case(id): links a test to a generated test case ID, e.g. case("LOGIN-003")
addopts = --strict-markers
